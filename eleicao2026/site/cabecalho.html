<style>
/* Layout: uma coluna larga e calma, menu de botões grandes no topo, cada seção liga para a próxima. */
:root{
  --bg:#F4F7FA; --panel:#FFFFFF; --fg:#0E1726; --muted:#414C5C; --line:#B8C4D2;
  --lula:#B9400B; --flavio:#1C4FC9; --neutral:#5B6472; --focus:#E8B500; --soft:#E6ECF3;
  --warn-bg:#FFF4D6; --warn-fg:#4A3500; --warnc:#B86E00;
  --f-body:"Atkinson Hyperlegible", "Verdana", "Segoe UI", sans-serif;
  --f-head:"Source Serif 4", Georgia, "Times New Roman", serif;
  --base:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141C; --panel:#16202B; --fg:#F2F5F8; --muted:#C2CBD6; --line:#3A4858;
  --lula:#FF9A5C; --flavio:#7FAEFF; --neutral:#9AA5B3; --focus:#FFD54A; --soft:#1F2B38;
  --warn-bg:#3A2E0A; --warn-fg:#FFE7A3; --warnc:#FFB547; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141C; --panel:#16202B; --fg:#F2F5F8; --muted:#C2CBD6; --line:#3A4858;
  --lula:#FF9A5C; --flavio:#7FAEFF; --neutral:#9AA5B3; --focus:#FFD54A; --soft:#1F2B38;
  --warn-bg:#3A2E0A; --warn-fg:#FFE7A3; --warnc:#FFB547; color-scheme:dark}
[hidden]{display:none!important}
html{font-size:var(--base)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem}
.wrap{max-width:60rem;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2.2rem;font-weight:800}
h2{font-size:1.75rem;font-weight:800}
h3{font-size:1.25rem;font-weight:600}
p{margin:0;max-width:40em}
.num{font-variant-numeric:tabular-nums}
a{color:var(--flavio)}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
button,select,input{font:inherit;color:inherit}

header.top{display:flex;flex-direction:column;gap:.8rem;padding-block:1.4rem 1rem}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.eyebrow{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.size{display:flex;gap:.5rem;align-items:center}
.size span{color:var(--muted);font-size:.9rem}
.size button{min-width:3.2rem;min-height:3rem;border:2px solid var(--line);background:var(--panel);border-radius:.6rem;font-weight:700;cursor:pointer}

nav.menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:.6rem;border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.menu ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.5rem;max-width:60rem}
.menu button{width:100%;min-height:3.4rem;padding:.4rem .6rem;border:2px solid var(--line);border-radius:.7rem;background:var(--panel);font-weight:700;cursor:pointer;line-height:1.2}
.menu button[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:.8rem;padding:1rem 1.2rem;margin-block:1rem;display:flex;flex-direction:column;gap:.4rem}
.notice strong{font-size:1.05rem}

section.view{display:flex;flex-direction:column;gap:1.4rem;padding-block:1.4rem}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:1.3rem;display:flex;flex-direction:column;gap:1rem;min-width:0}
.lead{font-size:1.2rem}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* resultado */
.winner{display:flex;flex-direction:column;gap:.4rem}
.winner .big{font-family:var(--f-head);font-size:2.4rem;font-weight:800;line-height:1.1}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:560px){.cands{grid-template-columns:1fr}}
.cand{border-radius:.9rem;padding:1rem 1.1rem;border:3px solid var(--line);display:flex;flex-direction:column;gap:.2rem}
.cand.l{border-color:var(--lula)} .cand.f{border-color:var(--flavio)}
.cand .name{font-weight:700;font-size:1.15rem}
.cand .pct{font-size:2.6rem;font-weight:700;line-height:1.1}
.cand.l .pct{color:var(--lula)} .cand.f .pct{color:var(--flavio)}
.bar{display:flex;height:3rem;border-radius:.6rem;overflow:hidden;border:2px solid var(--line)}
.bar div{display:flex;align-items:center;padding-inline:.6rem;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden}
.bar .bl{background:var(--lula)} .bar .bf{background:var(--flavio);justify-content:flex-end}
:root[data-theme="dark"] .bar div{color:#0D141C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar div{color:#0D141C}}
.half{position:relative}
.half::after{content:"metade";position:absolute;left:50%;top:-1.5rem;transform:translateX(-50%);font-size:.8rem;color:var(--muted)}
.half .midline{position:absolute;left:50%;top:-.3rem;bottom:-.3rem;border-left:3px dashed var(--fg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.8rem}
.fact{background:var(--soft);border-radius:.8rem;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.1rem}
.fact b{font-size:1.4rem}
.next{display:flex;flex-wrap:wrap;gap:.7rem}
.btn{min-height:3.4rem;padding:.6rem 1.2rem;border-radius:.8rem;border:2px solid var(--fg);background:var(--fg);color:var(--bg);font-weight:700;cursor:pointer}
.btn.alt{background:var(--panel);color:var(--fg)}
details{border-top:2px solid var(--line);padding-top:.8rem}
summary{cursor:pointer;font-weight:700;min-height:2.6rem;display:flex;align-items:center}
details p{margin-top:.5rem}

table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
th,td{padding:.55rem .6rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.9rem;color:var(--muted)}
tr.rowbtn{cursor:pointer}
tr.rowbtn:hover td{background:var(--soft)}

/* mapa */
.toggle{display:flex;gap:.5rem;flex-wrap:wrap}
.toggle button{min-height:3.2rem;padding:.4rem 1rem;border:2px solid var(--line);border-radius:.7rem;background:var(--panel);font-weight:700;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mapgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.35rem;max-width:30rem}
.tile{aspect-ratio:1;max-width:100%;border-radius:.5rem;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:700;line-height:1.05;padding:0}
.tile .uf{font-size:1.05rem}
.tile .p{font-size:.7rem;font-weight:400}
.tile[aria-pressed="true"]{border-color:var(--fg);outline:3px solid var(--focus)}
.mapbox{display:grid;grid-template-columns:minmax(0,30rem) minmax(0,1fr);gap:1.4rem;align-items:start}
@media (max-width:820px){.mapbox{grid-template-columns:1fr}}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.9rem}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.sw{width:1.2rem;height:1.2rem;border-radius:.3rem;display:inline-block}
.detail{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.mini{display:flex;flex-direction:column;gap:.3rem}
.chg{font-weight:700}

/* gráfico de barras divergentes */
.chart{display:flex;flex-direction:column;gap:.15rem}
.drow{display:grid;grid-template-columns:minmax(6rem,11rem) 1fr 1fr;align-items:center;gap:0;min-height:1.9rem;font-size:.9rem}
.drow.head{font-weight:700}
.dn{padding-right:.5rem;line-height:1.15}
.dl,.dr{display:flex;align-items:center;gap:.3rem;height:1.5rem;min-width:0}
.dl{flex-direction:row-reverse;border-right:3px solid var(--fg)}
.dl i,.dr i{display:block;height:100%;border-radius:3px;min-width:2px;flex:none}
.dl i{background:var(--lula)} .dr i{background:var(--flavio)}
.dl em,.dr em{font-style:normal;font-size:.75rem;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:640px){.drow{grid-template-columns:1fr 1fr;row-gap:.1rem;padding-block:.2rem}.dn{grid-column:1/-1}}
.drow.head span:nth-child(2){padding-right:.4rem} .drow.head span:nth-child(3){padding-left:.4rem}

/* simulador */
.field{display:flex;flex-direction:column;gap:.4rem}
.field label{font-weight:700}
select{min-height:3.2rem;border:2px solid var(--line);border-radius:.6rem;background:var(--panel);padding:.3rem .6rem;max-width:100%}
input[type=range]{width:100%;height:2.6rem;accent-color:var(--fg)}
input[type=number]{min-height:3rem;border:2px solid var(--line);border-radius:.6rem;background:var(--panel);padding:.3rem .6rem;width:10rem;max-width:100%}
.out{font-size:1.15rem}
.outbig{font-family:var(--f-head);font-size:1.6rem;font-weight:800}
.tag{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-size:.85rem;font-weight:700;background:var(--soft)}
.tag.hyp{background:var(--warn-bg);color:var(--warn-fg)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:640px){.cols2{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:.5rem}
.c-l{color:var(--lula);font-weight:700} .c-f{color:var(--flavio);font-weight:700}
@media (prefers-reduced-motion:no-preference){.bar div{transition:width .4s ease}}
