name: Procurar páginas oficiais (temporário)
on:
  push:
    branches: [notas-donos]
    paths: [etl/procurar_paginas.py]
jobs:
  procurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: etl/.cache
          key: dados-x
          restore-keys: dados-
      - run: python etl/procurar_paginas.py || true
