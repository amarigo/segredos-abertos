name: Sonda do Portal (temporária)
on:
  pull_request:
    paths: [etl/sondar_portal.py, .github/workflows/sonda-portal.yml]
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - working-directory: etl
        env:
          PORTAL_TRANSPARENCIA_CHAVE: ${{ secrets.PORTAL_TRANSPARENCIA_CHAVE }}
        run: python sondar_portal.py
