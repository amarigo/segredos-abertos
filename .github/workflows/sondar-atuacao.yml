name: Sondar atuação (temporário)
on:
  push:
    branches: [atuacao]
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r etl/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: etl/.cache
          key: dados-sondar-nao-existe
          restore-keys: dados-
      - run: python etl/sondar_atuacao.py
        continue-on-error: true
