name: Sondar autoria (temporário)
on:
  push:
    branches: [sondar-atuacao]
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r etl/requirements.txt
      - run: python etl/sondar_autoria.py
        continue-on-error: true
