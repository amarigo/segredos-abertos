name: Sondar emendas (temporário)
on:
  push:
    branches: [claude/project-thread-960m2s]
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - working-directory: etl
        run: |
          python - <<'PY'
          import json, logging, zipfile, itertools
          from pathlib import Path
          from sa_etl import emendas, camara, senado
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(name)s %(message)s")
          z = emendas.baixar(Path(".cache/emendas"))
          print("ZIP", z, z and z.stat().st_size)
          with zipfile.ZipFile(z) as f:
              for i in f.infolist(): print("ARQ", i.filename, i.file_size)
          for parte in ("", "favorecido", "convenio"):
              for r in itertools.islice(emendas.linhas(z, parte), 3): print("LINHA", parte, json.dumps(r, ensure_ascii=False))
          pols = camara.deputados() + senado.senadores()
          ind = emendas.coletar(pols, [2023, 2024, 2025, 2026], Path(".cache/emendas"), Path("/tmp/out"))
          print("INDICE", ind)
          d = json.loads(Path("/tmp/out/emendas/2025.json").read_text())
          print("SEMPART", d["sem_partido"])
          print("PART", json.dumps(d["partidos"][:3], ensure_ascii=False))
          print("COL", json.dumps(d["coletivos"][:3], ensure_ascii=False))
          f = d["favorecidos"]
          print("FAVCAT", f["por_categoria"]); print("UF", f["por_uf"][:5]); print("MUN", f["municipios"][:10])
          print("EMP", json.dumps(f["empresas"][:5], ensure_ascii=False))
          print("ENT", json.dumps(f["entidades"][:3], ensure_ascii=False))
          print("AUT", json.dumps(d["autores"][:3], ensure_ascii=False))
          # amostra reduzida para conferir a página localmente
          d["autores"] = d["autores"][:40]; d["coletivos"] = d["coletivos"][:15]
          for k in ("lista", "empresas", "entidades"): f[k] = f[k][:20]
          f["municipios"] = f["municipios"][:40]
          import gzip, base64
          b = base64.b64encode(gzip.compress(json.dumps(d, ensure_ascii=False).encode())).decode()
          print("AMOSTRA", b)
          print("TAMANHO", {p.name: p.stat().st_size for p in Path("/tmp/out/emendas").iterdir()})
          PY
