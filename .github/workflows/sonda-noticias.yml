name: Sonda notícias (temporária)
on:
  push:
    branches: [claude/project-thread-i1fto7]
    paths: [".github/sonda/**", ".github/workflows/sonda-noticias.yml"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests && python .github/sonda/sonda.py
