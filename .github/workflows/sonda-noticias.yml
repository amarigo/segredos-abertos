name: Sonda notícias (temporária)
on:
  push:
    branches: [claude/project-thread-i1fto7]
    paths: [".github/sonda/**", ".github/workflows/sonda-noticias.yml", "etl/sa_etl/noticias.py"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt && python .github/sonda/sonda.py
