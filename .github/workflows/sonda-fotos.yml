name: Sonda das fotos (temporária)
on:
  pull_request:
    paths: [etl/sondar_fotos.py, .github/workflows/sonda-fotos.yml]
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - working-directory: etl
        run: python sondar_fotos.py
