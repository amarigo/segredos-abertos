name: Sondar notas (temporário)
on:
  push:
    branches: [sondar-notas]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r etl/requirements.txt
      - run: python etl/sondar_notas.py
        continue-on-error: true
