name: Sonda do PNCP (temporária)
on:
  push:
    branches: [claude/project-thread-w42wwq]
    paths: [etl/sondar_pncp.py, .github/workflows/sonda-pncp.yml]
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - working-directory: etl
        run: python sondar_pncp.py
