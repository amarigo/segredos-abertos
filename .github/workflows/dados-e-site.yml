name: Dados e site

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * *" # todo dia às 6h de Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dados-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt -r etl/requirements-dev.txt
      - run: python -m pytest -q etl/tests
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  coletar:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - name: Cache dos downloads e das consultas de CNPJ
        uses: actions/cache@v4
        with:
          path: etl/.cache
          key: dados-${{ github.run_id }}
          restore-keys: dados-
      - name: Limpar arquivos do ano corrente (para baixar a versão nova)
        run: rm -f etl/.cache/*-$(date +%Y).csv* || true
      - name: Coletar dados oficiais
        working-directory: etl
        run: python -m sa_etl.build --saida ../site/public/data --cache .cache
      - name: Resumo da coleta
        run: |
          cat site/public/data/meta.json
          echo
          du -sh site/public/data
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  publicar:
    needs: coletar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
