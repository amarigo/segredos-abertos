name: Dados e site

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * *" # todo dia às 6h de Brasília
  workflow_dispatch:
    inputs:
      ignorar_queda:
        description: "Publicar mesmo com queda grande em relação à versão no ar (use só se a queda for real)"
        type: boolean
        default: false

# Só leitura por padrão. A permissão de publicar fica só no job "publicar".
permissions:
  contents: read

concurrency:
  group: dados-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Base e meio da pirâmide: unitários, propriedades, integração com o governo simulado e caos no coletor
  testes-coletor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAOS_RODADAS: ${{ github.event_name == 'schedule' && '60' || '12' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt -r etl/requirements-dev.txt
      - run: python -m pytest -q etl/tests
      - name: Coletor do Minas Nossa (MG)
        run: python -m pytest -q mg/etl/tests

  # Topo da pirâmide: o site no navegador (jornada, segurança e caos), com dados fictícios
  testes-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - name: Dados fictícios para o navegador
        run: |
          python etl/tests/gerar_dados_teste.py site/public/data
          python mg/etl/tests/gerar_dados_teste_mg.py site/public/data site/public-mg/data
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build && npm run build:mg
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:e2e
        working-directory: site
        env:
          CI: "1"
      - name: Navegador no Minas Nossa
        run: npm run test:e2e:mg
        working-directory: site
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: |
            site/playwright-report
            site/playwright-report-mg
          retention-days: 7

  # Dependências com falhas de segurança conhecidas. Não trava a coleta diária: aparece como falha para corrigir.
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: Python (coletor)
        run: pip-audit -r etl/requirements.txt -r etl/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript (o que vai para o site publicado)
        working-directory: site
        run: npm audit --omit=dev --audit-level=high

  coletar:
    needs: [testes-coletor, testes-site]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - name: Cache dos downloads e das consultas de CNPJ
        uses: actions/cache@v4
        with:
          path: etl/.cache
          key: dados-${{ github.run_id }}
          restore-keys: dados-
      - name: Coletar dados oficiais
        working-directory: etl
        run: python -m sa_etl.build --saida ../site/public/data --cache .cache 2>&1 | tee coleta.log
      - name: Resumo da coleta
        run: |
          grep -E "INFO|WARNING|ERROR" etl/coleta.log | cut -c1-240 | tail -n 60
          python etl/resumo.py site/public/data | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Conferir os dados (se algo não bater, não publica e o site continua com a versão anterior)
        working-directory: etl
        env:
          IGNORAR_QUEDA: ${{ inputs.ignorar_queda && '--ignorar-queda' || '' }}
        run: |
          set -o pipefail
          python -m sa_etl.validar ../site/public/data --anterior https://amarigo.github.io/segredos-abertos/data/meta.json $IGNORAR_QUEDA \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Minas Nossa (/mg/): recorte de MG dos dados acima e histórico das cidades no TSE. Qualquer falha aqui não
      # trava o site nacional: o Minas Nossa usa a última versão publicada (dados-mg.zip) e avisa no resumo.
      - name: Cache do TSE (Minas Nossa)
        uses: actions/cache@v4
        with:
          path: mg/etl/.cache
          key: mg-tse-${{ github.run_id }}
          restore-keys: mg-tse-
      - name: "Minas Nossa: montar os dados de MG"
        id: mg
        continue-on-error: true
        working-directory: mg/etl
        env:
          PYTHONPATH: ../../etl
        run: |
          set -o pipefail
          python -m mg_etl.build --nacional ../../site/public/data --saida ../../site/public-mg/data --cache .cache 2>&1 | tee coleta-mg.log
      - name: "Minas Nossa: conferir os dados"
        id: mg_conf
        if: steps.mg.outcome == 'success'
        continue-on-error: true
        working-directory: mg/etl
        env:
          PYTHONPATH: ../../etl
          IGNORAR_QUEDA: ${{ inputs.ignorar_queda && '--ignorar-queda' || '' }}
        run: |
          set -o pipefail
          python -m mg_etl.validar ../../site/public-mg/data --anterior https://amarigo.github.io/segredos-abertos/mg/data/meta.json $IGNORAR_QUEDA \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Minas Nossa: se algo falhou, usar a versão publicada"
        id: mg_dados
        env:
          CONFERIDO: ${{ steps.mg_conf.outcome }}
        run: |
          if [ "$CONFERIDO" = "success" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning::Minas Nossa: a coleta ou a conferência falhou; usando a última versão publicada"
          rm -rf site/public-mg/data && mkdir -p site/public-mg/data
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/dados-mg.zip" https://amarigo.github.io/segredos-abertos/mg/dados-mg.zip \
             && unzip -q "$RUNNER_TEMP/dados-mg.zip" -d site/public-mg/data; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "### Minas Nossa: dados novos com problema; publicada de novo a versão anterior" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "### Minas Nossa: sem dados novos nem versão anterior; fica fora desta publicação" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm ci && npm run build
        working-directory: site
      - name: "Minas Nossa: montar o site em /mg/"
        if: steps.mg_dados.outputs.ok == '1'
        working-directory: site
        run: |
          npm run build:mg
          (cd public-mg/data && zip -qr ../../dist/mg/dados-mg.zip .)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Conferir links das notas
        continue-on-error: true
        run: python etl/conferir_links.py site/public/data etl/.cache | tee -a "$GITHUB_STEP_SUMMARY"

  publicar:
    needs: coletar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
