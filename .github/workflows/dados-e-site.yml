name: Dados e site

on:
  # Push só no main. Antes, todo push num branch de PR rodava também a coleta inteira (perto de 1 hora, com milhares de
  # pedidos às APIs do governo) sem publicar nada, e disputava os mesmos limites do Portal com a coleta do main. Os
  # testes dos PRs continuam pelo evento pull_request.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Todo dia às 3h17 de Brasília (6h17 UTC): madrugada é o horário com menos tráfego nas APIs do governo, e elas
    # deixam de responder menos. O minuto 17 foge do pico de agendamentos do próprio GitHub na hora cheia, que atrasa a
    # partida. Se mudar aqui, mude também HORA_AGENDADA_UTC e MINUTO_AGENDADO_UTC em status/painel.js.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      ignorar_queda:
        description: "Publicar mesmo com queda grande em relação à versão no ar (use só se a queda for real)"
        type: boolean
        default: false
      ignorar_barreira:
        description: "Publicar mesmo com diferenças sem motivo conhecido acima do limite na verificação (o site mostra a situação)"
        type: boolean
        default: false

# Só leitura por padrão. A permissão de publicar fica só no job "publicar".
permissions:
  contents: read

# No main, um push novo espera a execução em andamento terminar (fica na fila) em vez de cancelá-la: cancelar no meio
# jogava fora a coleta (que leva perto de 1 hora) e o site ficava sem atualizar quando vários PRs entravam seguidos.
# Nos outros branches (PRs), o push novo cancela o anterior, que só roda testes.
concurrency:
  group: dados-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Base e meio da pirâmide: unitários, propriedades, integração com o governo simulado e caos no coletor
  testes-coletor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAOS_RODADAS: ${{ github.event_name == 'schedule' && '60' || '12' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt -r etl/requirements-dev.txt
      - run: python -m pytest -q etl/tests
      - name: Coletor do Minas Nossa (MG)
        run: python -m pytest -q mg/etl/tests
      - name: Coletor da Eleição 2026
        run: python -m pytest -q eleicao2026/etl/tests
      - name: Painel de análises
        run: python -m pytest -q analises/tests

  # Topo da pirâmide: o site no navegador (jornada, segurança e caos), com dados fictícios
  testes-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - name: Dados fictícios para o navegador
        run: |
          python etl/tests/gerar_dados_teste.py site/public/data
          python mg/etl/tests/gerar_dados_teste_mg.py site/public/data site/public-mg/data
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - name: Painel de status (contas)
        run: node --test status/painel.test.mjs
      # Chromium guardado entre execuções; instalado sem apt (o espelho do Ubuntu do GitHub caiu em 11/11/2026 e
      # travava este passo). Detalhes em site/scripts/instalar-chromium.sh.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - run: bash scripts/instalar-chromium.sh
        working-directory: site
        timeout-minutes: 12
      # paginas: imagem de prévia e uma página HTML simples por político, empresa e votação (PT/EN/ES), sitemap e llms.txt,
      # para buscadores, IAs e quem compartilha o link
      - run: npm run build && npm run paginas && npm run build:mg && npm run paginas:mg
        working-directory: site
      - run: npm run test:e2e
        working-directory: site
        env:
          CI: "1"
      - name: Navegador no Minas Nossa
        run: npm run test:e2e:mg
        working-directory: site
        env:
          CI: "1"
      # Eleição 2026: com os dados reais (boletins guardados em eleicao2026/dados), já conferidos com o oficial
      - name: "Eleição 2026: montar o site"
        working-directory: eleicao2026/etl
        run: python -m el_etl.build montar --saida ../../site/dist/eleicao2026
      - name: Navegador na Eleição 2026
        run: npm run test:e2e:eleicao
        working-directory: site
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: |
            site/playwright-report
            site/playwright-report-mg
            site/playwright-report-eleicao
          retention-days: 7

  # Dependências com falhas de segurança conhecidas. Não trava a coleta diária: aparece como falha para corrigir.
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: Python (coletor)
        run: pip-audit -r etl/requirements.txt -r etl/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript (o que vai para o site publicado)
        working-directory: site
        run: npm audit --omit=dev --audit-level=high

  coletar:
    needs: [testes-coletor, testes-site]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - name: Cache dos downloads e das consultas de CNPJ
        uses: actions/cache@v4
        with:
          path: etl/.cache
          key: dados-${{ github.run_id }}
          restore-keys: dados-
      - name: Coletar dados oficiais
        working-directory: etl
        env:
          # Chave da API de dados do Portal da Transparência (cadastro grátis em
          # https://portaldatransparencia.gov.br/api-de-dados/cadastrar-email). Sem ela, a renúncia fiscal só vem
          # pelos arquivos de download, que o Portal às vezes recusa.
          PORTAL_TRANSPARENCIA_CHAVE: ${{ secrets.PORTAL_TRANSPARENCIA_CHAVE }}
        # Se quebrar, a última linha do registro (o erro) vira anotação para o painel de status (/status/)
        run: |
          python -m sa_etl.build --saida ../site/public/data --cache .cache 2>&1 | tee coleta.log || {
            python anotar.py erro "Coleta dos dados" "A coleta parou com erro: $(grep -v '^\s*$' coleta.log | tail -n 1 | cut -c1-300)"
            exit 1
          }
      - name: Resumo da coleta
        run: |
          grep -E "INFO|WARNING|ERROR" etl/coleta.log | cut -c1-240 | tail -n 60
          python etl/resumo.py site/public/data | tee -a "$GITHUB_STEP_SUMMARY"
          python etl/anotar.py avisos site/public/data/meta.json "Aviso da coleta"
      - name: Conferir os dados (se algo não bater, não publica e o site continua com a versão anterior)
        working-directory: etl
        env:
          IGNORAR_QUEDA: ${{ inputs.ignorar_queda && '--ignorar-queda' || '' }}
        run: |
          set -o pipefail
          python -m sa_etl.validar ../site/public/data --anterior https://amarigo.github.io/segredos-abertos/data/meta.json $IGNORAR_QUEDA \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # Segunda fonte oficial: sorteia números do site e confere cada um numa fonte oficial diferente (etl/sa_etl/verificar.py).
      # Cada diferença é classificada (etl/sa_etl/oficial.py). Com motivo conhecido, o site já usa o número oficial e explica.
      # Sem motivo, fica "em revisão" no site; se passar do limite numa seção (código 3), a publicação é barrada e o site
      # continua com a versão anterior até alguém entender o motivo e registrá-lo em oficial.py.
      # Se a verificação quebrar por outro motivo (fonte fora do ar, erro no código), não barra: o site fica sem selo,
      # nunca com um selo de "conferido" falso. Empresas com diferença saem do cache e são consultadas de novo.
      - name: Verificação independente (segunda fonte oficial)
        timeout-minutes: 30
        working-directory: etl
        env:
          PORTAL_TRANSPARENCIA_CHAVE: ${{ secrets.PORTAL_TRANSPARENCIA_CHAVE }}
          IGNORAR_BARREIRA: ${{ inputs.ignorar_barreira && '--ignorar-barreira' || '' }}
        run: |
          set +e
          python -m sa_etl.verificar ../site/public/data --minutos 20 --cache .cache $IGNORAR_BARREIRA \
            --anterior https://amarigo.github.io/segredos-abertos/data/verificacao.json > verificacao.md
          rc=$?
          cat verificacao.md | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 3 ]; then
            python anotar.py barreira ../site/public/data/verificacao.json
            exit 1
          fi
          [ "$rc" = 0 ] || echo "::warning title=Verificação com a segunda fonte::A verificação não terminou (código $rc); o site publica sem selo de conferido."
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Minas Nossa (/mg/): recorte de MG dos dados acima e histórico das cidades no TSE. Qualquer falha aqui não
      # trava o site nacional: o Minas Nossa usa a última versão publicada (dados-mg.zip) e avisa no resumo.
      - name: Cache do TSE (Minas Nossa)
        uses: actions/cache@v4
        with:
          path: mg/etl/.cache
          key: mg-tse-${{ github.run_id }}
          restore-keys: mg-tse-
      - name: "Minas Nossa: montar os dados de MG"
        id: mg
        continue-on-error: true
        timeout-minutes: 65  # inclui até 18 min de leitura do PNCP (licitações) e até 12 min do PNCP e do SALIC (Shows e cultura)
        working-directory: mg/etl
        env:
          PYTHONPATH: ../../etl
        run: |
          set -o pipefail
          python -m mg_etl.build --nacional ../../site/public/data --saida ../../site/public-mg/data --cache .cache 2>&1 | tee coleta-mg.log
      - name: "Minas Nossa: conferir os dados"
        id: mg_conf
        if: steps.mg.outcome == 'success'
        continue-on-error: true
        working-directory: mg/etl
        env:
          PYTHONPATH: ../../etl
          IGNORAR_QUEDA: ${{ inputs.ignorar_queda && '--ignorar-queda' || '' }}
        run: |
          set -o pipefail
          python -m mg_etl.validar ../../site/public-mg/data --anterior https://amarigo.github.io/segredos-abertos/mg/data/meta.json $IGNORAR_QUEDA \
            | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/conferencia-mg.txt"
      - name: "Minas Nossa: se algo falhou, usar a versão publicada"
        id: mg_dados
        env:
          CONFERIDO: ${{ steps.mg_conf.outcome }}
        run: |
          if [ "$CONFERIDO" = "success" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning title=Minas Nossa::A coleta ou a conferência de MG falhou; o Minas Nossa ficou com a última versão publicada"
          rm -rf site/public-mg/data && mkdir -p site/public-mg/data
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/dados-mg.zip" https://amarigo.github.io/segredos-abertos/mg/dados-mg.zip \
             && unzip -q "$RUNNER_TEMP/dados-mg.zip" -d site/public-mg/data; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "### Minas Nossa: dados novos com problema; publicada de novo a versão anterior" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "### Minas Nossa: sem dados novos nem versão anterior; fica fora desta publicação" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Chromium sem tela para desenhar a imagem de prévia de cada político (scripts/cartoes.mjs). Se falhar, as páginas
      # saem sem imagem e o site é publicado do mesmo jeito.
      - run: npm ci && (bash scripts/instalar-chromium.sh || echo "::warning title=Cartões de prévia::Chromium não instalou") && npm run build && npm run paginas
        working-directory: site
      - name: "Minas Nossa: montar o site em /mg/"
        if: steps.mg_dados.outputs.ok == '1'
        working-directory: site
        run: |
          npm run build:mg
          npm run paginas:mg
          (cd public-mg/data && zip -qr ../../dist/mg/dados-mg.zip .)
      # Eleição 2026 (/eleicao2026/): boletins de urna do TSE guardados em eleicao2026/dados. Só entra no site se a soma
      # das urnas bater com o resultado oficial, voto por voto. Uma falha aqui não trava o site nacional.
      - name: "Eleição 2026: conferir e montar o site em /eleicao2026/"
        id: eleicao
        continue-on-error: true
        working-directory: eleicao2026/etl
        run: |
          set -o pipefail
          python -m el_etl.build montar --saida ../../site/dist/eleicao2026 | tee -a "$GITHUB_STEP_SUMMARY"
      # Terras Raras em Minas (/terras-raras/): planilhas escritas à mão em terras-raras/dados, cada linha com fonte e
      # data (não há API oficial que junte projetos, donos e licenças). Uma falha aqui não trava o site nacional.
      - name: "Terras Raras: montar o site em /terras-raras/"
        id: terras
        continue-on-error: true
        run: python terras-raras/gerar_pagina.py --site site/dist/terras-raras/index.html | tee -a "$GITHUB_STEP_SUMMARY"
      # Painel de análises (/analises/): todos os dados acima em tabelas CSV para baixar e em gráficos próprios
      # (Apache ECharts). Só reorganiza os arquivos já coletados; não busca nada novo. Uma falha aqui não trava o site.
      - name: "Análises: montar o painel em /analises/"
        id: analises
        continue-on-error: true
        run: |
          set -o pipefail
          MG=""; [ -f site/public-mg/data/meta.json ] && MG="--mg site/public-mg/data"
          python analises/publicar.py --nacional site/public/data $MG --eleicao eleicao2026/dados/tse \
            --terras terras-raras/dados --saida site/dist/analises | tee -a "$GITHUB_STEP_SUMMARY"
      # Painel de status (/status/): página estática que lê a situação das coletas na API do GitHub Actions
      - name: Painel de status
        run: mkdir -p site/dist/status && cp status/index.html status/painel.js site/dist/status/
      # Partes com continue-on-error não aparecem como falha na API do GitHub; o aviso deixa o motivo no painel de status
      - name: Avisos das partes que falharam
        if: always()
        env:
          MG: ${{ steps.mg.outcome }}
          MG_CONF: ${{ steps.mg_conf.outcome }}
          ELEICAO: ${{ steps.eleicao.outcome }}
          TERRAS: ${{ steps.terras.outcome }}
          ANALISES: ${{ steps.analises.outcome }}
        run: |
          [ "$MG" != "failure" ] || python etl/anotar.py falhou "Minas Nossa" "A montagem dos dados de MG falhou (veja a etapa 'Minas Nossa: montar os dados de MG')"
          [ "$MG_CONF" != "failure" ] || python etl/anotar.py falhou "Minas Nossa" "A conferência dos dados de MG não passou (veja a etapa 'Minas Nossa: conferir os dados')"
          [ "$ELEICAO" != "failure" ] || python etl/anotar.py falhou "Eleição 2026" "A conferência das urnas com o resultado oficial ou a montagem do site falhou (veja a etapa 'Eleição 2026: conferir e montar')"
          [ "$TERRAS" != "failure" ] || python etl/anotar.py falhou "Terras Raras" "A página de Terras Raras não foi montada (veja a etapa 'Terras Raras: montar')"
          [ "$ANALISES" != "failure" ] || python etl/anotar.py falhou "Análises" "O painel de análises não foi montado (veja a etapa 'Análises: montar o painel')"
          python etl/anotar.py avisos site/public-mg/data/meta.json "Minas Nossa: aviso da coleta" || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Conferir links das notas
        continue-on-error: true
        run: python etl/conferir_links.py site/public/data etl/.cache | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Resumo do Minas Nossa
        if: always()
        continue-on-error: true
        env:
          COLETA: ${{ steps.mg.outcome }}
          CONFERIDO: ${{ steps.mg_conf.outcome }}
        run: |
          python mg/etl/resumo_mg.py site/public-mg/data | tee -a "$GITHUB_STEP_SUMMARY"
          # No fim do registro (o registro do Actions é longo e só o fim aparece fácil): se o Minas Nossa ficou com a
          # versão anterior, o motivo aparece aqui, com o resultado da coleta e da conferência
          echo "Minas Nossa: coleta $COLETA, conferência $CONFERIDO"
          if [ "$CONFERIDO" != "success" ]; then
            echo "::warning title=Minas Nossa::coleta $COLETA, conferência $CONFERIDO; publicada a versão anterior"
            tail -n 60 "$RUNNER_TEMP/conferencia-mg.txt" 2>/dev/null || true
            grep -E "WARNING|ERROR|Traceback" mg/etl/coleta-mg.log 2>/dev/null | cut -c1-300 | tail -n 40 || true
          fi
      # No fim do registro, para achar rápido o que aconteceu com os downloads da página de incentivos
      - name: Incentivos no registro da coleta
        if: always()
        continue-on-error: true
        run: grep -E "Renúncias|Pagamentos gerais|Incentivos" etl/coleta.log | cut -c1-300 | tail -n 40 || true

  publicar:
    needs: coletar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Às vezes o GitHub Pages fica parado em "syncing_files" e a publicação estoura o tempo (10 minutos), mesmo com
      # tudo certo do nosso lado. Foi o que aconteceu em 08/11/2026 (execução 441): a coleta e a conferência passaram e
      # a execução seguinte publicou o mesmo site (263 MB) em 38 segundos. Por isso, se a primeira tentativa falhar,
      # espera 1 minuto e tenta de novo com o mesmo pacote. Só falha se as duas falharem.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Publicação falhou; esperar antes de tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning title=Publicação::A primeira tentativa de publicar no GitHub Pages falhou; tentando de novo."
          sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
