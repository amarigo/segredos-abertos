name: Sondar pagamentos de emendas (temporário)
on:
  push:
    branches: [claude/project-thread-960m2s]
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - working-directory: etl
        run: |
          python - <<'PY'
          import csv, io, json, time, zipfile, logging
          from collections import Counter
          from pathlib import Path
          from sa_etl import pagamentos as p
          logging.basicConfig(level=logging.INFO)
          tmp = Path("/tmp/d.zip")
          print("baixou", p._baixar_dia("20251015", tmp))
          z = zipfile.ZipFile(tmp)
          c = Counter(r.get("Autor Emenda", "") for r in p._tabela(z, "_Despesas_Empenho.csv"))
          print("AUTORES", c.most_common(12), len(c))
          emp = set()
          t = time.time(); tot = {"e": 0, "p": 0}
          for dia in ["20251013", "20251014", "20251015", "20251016", "20251017", "20251018", "20251020"]:
              t0 = time.time(); ok = p._baixar_dia(dia, tmp); t1 = time.time()
              if not ok: print("DIA", dia, ok); continue
              d = p.ler_dia(tmp, emp)
              print("DIA", dia, "download %.1fs leitura %.1fs" % (t1 - t0, time.time() - t1), len(d["empenhos"]), "empenhos", len(d["pagamentos"]), "pagamentos",
                    "R$ %.0f" % sum(x["valor"] for x in d["empenhos"]), "pago R$ %.0f" % sum(v for x in d["pagamentos"] for _, v in x["empenhos"]))
              if dia == "20251016":
                  for e in d["empenhos"][:3]: print("  EMP", json.dumps(e, ensure_ascii=False))
                  for x in d["pagamentos"][:4]: print("  PAG", json.dumps(x, ensure_ascii=False))
                  print("  ORGAOS", Counter(x["orgao_sup"] for x in d["pagamentos"]).most_common(8))
                  print("  FAV", Counter(x["favorecido"] for x in d["pagamentos"]).most_common(8))
                  print("  MOD", Counter(x["modalidade"] for x in d["empenhos"]).most_common(8))
          print("total %.0fs" % (time.time() - t))
          PY
          for u in https://portaldatransparencia.gov.br/despesas/documento/empenho/154040152572025NE002378 https://portaldatransparencia.gov.br/despesas/documento/pagamento/154003152792025OB023004; do curl -sSL -A "Mozilla/5.0" -o /tmp/pg.html -w "%{http_code} %{url_effective}\n" "$u"; grep -o "<title>[^<]*" /tmp/pg.html | head -2; grep -c "2025NE002378\|2025OB023004" /tmp/pg.html; done
