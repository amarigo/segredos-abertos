name: Sondagem MG (temporário)

# Fase 0 do Minas Nossa: sonda as fontes de MG e mostra o relatório no resumo. Não publica nada.
on:
  push:
    paths:
      - "mg/sondagem/**"
      - ".github/workflows/sondar-mg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - run: python mg/sondagem/sondar.py sondagem
      - run: cat sondagem/relatorio.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sondagem-mg
          path: sondagem
          retention-days: 14
