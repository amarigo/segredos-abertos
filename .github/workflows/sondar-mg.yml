name: Sondagem MG (temporário)

# Fase 2 do Minas Nossa: formato real das fontes do estado e das cidades. Não publica nada.
on:
  push:
    paths:
      - "mg/sondagem/**"
      - "mg/etl/diag_tse.py"
      - ".github/workflows/sondar-mg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - name: Cache do TSE (só leitura)
        uses: actions/cache/restore@v4
        with:
          path: mg/etl/.cache
          key: mg-tse-nenhum
          restore-keys: mg-tse-
      - run: python mg/sondagem/sondar_estado.py sondagem
      - run: python mg/etl/diag_tse.py mg/etl/.cache | tee -a sondagem/relatorio.md
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sondagem-mg
          path: sondagem
          retention-days: 14
