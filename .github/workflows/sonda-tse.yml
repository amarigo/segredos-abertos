name: Sonda do TSE (temporária)
on:
  pull_request:
    paths: [eleicao2026/etl/sondar_tse.py, .github/workflows/sonda-tse.yml]
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - working-directory: eleicao2026/etl
        run: python sondar_tse.py
