name: Tentar de novo

# Quando a coleta publicada saiu com aviso de site oficial fora do ar (por exemplo, "Emendas: o Portal da
# Transparência não respondeu"), roda a coleta de novo a cada 2 horas, até todos os sites responderem.
# A coleta guarda no cache o que já baixou, então a nova tentativa só busca de novo o que faltou.
#
# Para atualizar na hora, sem esperar: Actions > "Dados e site" > Run workflow.
on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:

permissions:
  actions: write # para ver as coletas em andamento e disparar uma nova
  contents: read

concurrency:
  group: tentar-de-novo
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Nunca falha: um problema aqui só adia a tentativa para daqui a 2 horas (e aparece no resumo).
      - name: Coletar de novo se faltou algum dado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          META: https://amarigo.github.io/segredos-abertos/data/meta.json
        run: |
          resumo() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if ! meta=$(curl -fsSL --retry 3 --max-time 60 "$META") || ! jq -e 'type == "object"' >/dev/null 2>&1 <<< "$meta"; then
            resumo "Não consegui ler o meta.json publicado; fica para a próxima tentativa."
            exit 0
          fi
          # Só os avisos que outra coleta pode resolver ("avisos_tentar"). Os outros (por exemplo, arquivos que o
          # Portal recusa a robôs, já lidos por outro caminho) ficam no site, mas não disparam coleta nova.
          avisos=$(jq -r '(.avisos_tentar // .avisos // [])[]' <<< "$meta")
          if [ -z "$avisos" ]; then
            resumo "A última coleta publicada não tem nada que uma nova tentativa resolva ($(jq -r '.atualizado_em // "?"' <<< "$meta")). Nada a fazer."
            fixos=$(jq -r '(.avisos // []) - (.avisos_tentar // .avisos // []) | .[]' <<< "$meta")
            [ -z "$fixos" ] || { resumo "Avisos que esperam outro caminho (não adianta coletar de novo):"; while IFS= read -r a; do resumo "- $a"; done <<< "$fixos"; }
            exit 0
          fi

          # Não atrapalha uma coleta que já está rodando (uma nova cancelaria a que está em andamento).
          if ! rodando=$(gh run list --workflow dados-e-site.yml --branch main --limit 20 --json status \
                           --jq '[.[] | select(.status != "completed")] | length'); then
            resumo "Não consegui ver as coletas em andamento; fica para a próxima tentativa."
            exit 0
          fi
          if [ "$rodando" != "0" ]; then
            resumo "Já há uma coleta em andamento; ela vai tentar de novo os sites que falharam."
            exit 0
          fi

          resumo "A última coleta publicada saiu com avisos:"
          while IFS= read -r a; do resumo "- $a"; done <<< "$avisos"
          if gh workflow run dados-e-site.yml --ref main; then
            resumo "Nova coleta disparada."
          else
            resumo "Não consegui disparar a coleta; fica para a próxima tentativa."
          fi

      # A leitura semanal dos pagamentos a empresas (pagamentos-empresas.yml) usa a mesma fila da coleta diária. O GitHub
      # guarda só uma execução esperando em cada fila: se outra chega, a que esperava é cancelada sem rodar. Foi o que
      # aconteceu com a primeira leitura, em 04/11/2026 (cancelada pelo push seguinte no main). Aqui, se a leitura não
      # terminou bem nos últimos 7 dias, não houve tentativa nas últimas 24 horas e a fila está vazia, ela é disparada
      # de novo: começa na hora, e uma execução que já começou não é cancelada por quem chega depois.
      - name: Leitura semanal dos pagamentos a empresas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          resumo() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          semana=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          dia=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          if ! leituras=$(gh run list --workflow pagamentos-empresas.yml --limit 30 --json status,conclusion,createdAt); then
            resumo "Não consegui ver as leituras dos pagamentos a empresas; fica para a próxima verificação."
            exit 0
          fi
          em_dia=$(jq --arg s "$semana" '[.[] | select(.createdAt >= $s) | select(.conclusion == "success" or .status != "completed")] | length' <<< "$leituras")
          recente=$(jq --arg d "$dia" '[.[] | select(.createdAt >= $d) | select(.conclusion != "cancelled" and .conclusion != "skipped")] | length' <<< "$leituras")
          if [ "$em_dia" != "0" ]; then
            resumo "Leitura dos pagamentos a empresas: em dia ou em andamento."
            exit 0
          fi
          if [ "$recente" != "0" ]; then
            resumo "Leitura dos pagamentos a empresas: a última tentativa (há menos de 24 horas) não terminou bem; veja a execução em Actions > Pagamentos a empresas."
            exit 0
          fi
          if ! ocupada=$(gh run list --workflow dados-e-site.yml --branch main --limit 20 --json status \
                           --jq '[.[] | select(.status != "completed")] | length'); then
            resumo "Não consegui ver as coletas em andamento; a leitura dos pagamentos fica para a próxima verificação."
            exit 0
          fi
          if [ "$ocupada" != "0" ]; then
            resumo "Leitura dos pagamentos a empresas atrasada, mas a fila está com a coleta diária; fica para a próxima verificação."
            exit 0
          fi
          if gh workflow run pagamentos-empresas.yml --ref main; then
            resumo "Leitura dos pagamentos a empresas disparada (nenhuma terminou bem nos últimos 7 dias)."
          else
            resumo "Não consegui disparar a leitura dos pagamentos a empresas; fica para a próxima verificação."
          fi
