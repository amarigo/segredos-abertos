name: Explorar fontes
on:
  push:
    branches: [explorar]
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests
      - run: >
          python tools/explorar.py
          "https://www.camara.leg.br/deputados/209787?ano=2025"
          "https://www.camara.leg.br/deputados/209787/pessoal-gabinete?ano=2025"
          "https://www.camara.leg.br/deputados/209787/verba-gabinete?ano=2025"
          "https://www.camara.leg.br/deputados/209787/remuneracao?ano=2025"
          "https://dadosabertos.camara.leg.br/api/v2/deputados/209787/despesas?ano=2025&itens=3"
          "https://www6g.senado.leg.br/transparencia/sen/5967/?ano=2025"
          "https://adm.senado.gov.br/adm-dadosabertos/v3/api-docs"
      - run: npm i playwright-core@1.56.0 && node tools/clicar.mjs
