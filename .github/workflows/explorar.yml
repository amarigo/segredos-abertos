name: Explorar fontes
on:
  push:
    branches: [explorar]
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests numpy
      - uses: actions/cache/restore@v4
        with:
          path: etl/.cache
          key: dados-x
          restore-keys: dados-
      - run: python tools/explorar3.py
      - name: Dados reais
        working-directory: etl
        run: python -m sa_etl.build --saida ../site/public/data --cache .cache > /dev/null 2>&1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build sem minificar e testar cliques
        working-directory: site
        run: |
          npm ci
          npx vite build --minify false --sourcemap
          (cd dist && python -m http.server 8080 > /dev/null 2>&1 &)
          sleep 2
          cd .. && npm i --no-save playwright-core@1.56.0 && BASE=http://localhost:8080/ node tools/clicar.mjs
