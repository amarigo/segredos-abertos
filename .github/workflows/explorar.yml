name: Explorar fontes
on:
  push:
    branches: [explorar]
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests numpy
      - uses: actions/cache/restore@v4
        with:
          path: etl/.cache
          key: dados-x
          restore-keys: dados-
      - run: python tools/explorar6.py
